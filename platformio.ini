; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nanoatmega328_old

; Mega 2560 com a pinagem do shield Speeduino.
; Vai para a pasta firmware/mega_speeduino/ da UI.
[env:megaatmega2560]
; TESTE_COMPRESSAO so aqui: a funcao esta em avaliacao e a Nano tem 136
; bytes de flash livres. Nos outros ambientes ela some na compilacao e o
; binario fica identico ao de antes.
build_flags = -D Speeduino -D TESTE_COMPRESSAO=1
platform = atmelavr
board = megaatmega2560
framework = arduino
upload_port = COM5

; Mega 2560 com a pinagem do Autoino. O Mega repete a pinagem do Uno na fileira
; de baixo, entao o mesmo shield encaixa e a fiacao nao muda - so o MCU.
; Vai para a pasta firmware/mega/ da UI.
;
; Unica diferenca funcional: a marcha lenta por PWM nao existe nesta variante
; (ver MARCHA_LENTA_PWM_* em definicoes_hardware.h). Liga/desliga e motor de
; passo funcionam normalmente.
[env:megaatmega2560_autoino]
build_flags = -D Autoino
platform = atmelavr
board = megaatmega2560
framework = arduino
upload_port = COM5

; -Wl,--relax: o linker troca CALL/JMP de 4 bytes por RCALL/RJMP de 2 sempre
; que o alvo esta ao alcance. Mediu 588 bytes na Nano (30592 -> 30004), que e
; o que abre espaco para a tabela de offset por cilindro.
; So nas placas de 328P: a Mega2560 tem 256 KB e o AVR ja teve problema de
; relaxamento atravessando a fronteira de 128 KB - la nao falta espaco, entao
; nao vale correr o risco.
[env:uno]
build_flags = -D Autoino -Wl,--relax
platform = atmelavr
board = uno
framework = arduino
upload_port = COM4

[env:nanoatmega328]
build_flags = -D Autoino -D TELEMETRIA_SEM_V3=1 -Wl,--relax
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_port = COM12
board_build.mcu = atmega328p

[env:nanoatmega328_old]
build_flags = -D Autoino -D TELEMETRIA_SEM_V3=1 -Wl,--relax
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_port = COM12
upload_speed = 57600
board_build.mcu = atmega328p